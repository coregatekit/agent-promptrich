apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradingview-mcp
  namespace: mcp-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tradingview-mcp
  template:
    metadata:
      labels:
        app: tradingview-mcp
    spec:
      containers:
        - name: mcp-server
          image: ghcr.io/coregatekit/tradingview-mcp:sha-da4343b
          # args:
          #   - "--transport"
          #   - "sse"
          #   - "--port"
          #   - "8000"
          env:
            - name: MCP_ALLOWED_HOSTS
              value: "*"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: tradingview-mcp-service
  namespace: mcp-tools
spec:
  selector:
    app: tradingview-mcp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
