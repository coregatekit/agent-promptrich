apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openclaw-ingress
  namespace: openclaw
  labels:
    app: openclaw
spec:
  ingressClassName: traefik
  rules:
    - host: openclaw.coregate.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openclaw
                port:
                  number: 18789