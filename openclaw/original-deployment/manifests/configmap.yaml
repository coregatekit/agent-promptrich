apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  labels:
    app: openclaw
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "lan",
        "port": 18789,
        "auth": {
          "mode": "token"
        },
        "controlUi": {
          "enabled": true,
          "allowedOrigins": ["https://openclaw.coregate.dev"]
        }
      },
      "agents": {
        "defaults": {
          "workspace": "~/.openclaw/workspace",
          "thinkingDefault": "off",
          "model": {
            "primary": "google/gemini-3.1-flash-lite",
            "fallbacks": [
              "google/gemini-3.1-flash",
              "google/gemini-3-flash"
            ]
          },
          "heartbeat": {
            "every": "0m"
          }
        },
        "list": [
          {
            "id": "default",
            "name": "OpenClaw Assistant",
            "workspace": "~/.openclaw/workspace"
          }
        ]
      },
      "mcp": {
        "servers": {
          "tradingview": {
            "url": "http://tradingview-mcp-service.mcp-tools.svc.cluster.local/mcp",
            "transport": "streamable-http"
          }
        }
      },
      "cron": { "enabled": false },
      "channels": {
        "telegram": {
          "botToken": {
            "source": "env",
            "provider": "default",
            "id": "TELEGRAM_BOT_TOKEN"
          }
        }
      }
    }
  AGENTS.md: |
    # OpenClaw Assistant

    You are a helpful AI assistant running in Kubernetes.
