apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  labels:
    app: openclaw
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "lan",
        "port": 18789,
        "auth": {
          "mode": "token"
        },
        "controlUi": {
          "enabled": true,
          "allowedOrigins": ["https://openclaw.coregate.dev"]
        }
      },
      "agents": {
        "defaults": {
          "workspace": "~/.openclaw/workspace",
          "thinkingDefault": "off",
          "model": {
            "primary": "google/gemini-3.5-flash",
            "fallbacks": [
              "google/gemini-3.1-flash-lite"
            ]
          },
          "heartbeat": {
            "every": "0m"
          }
        },
        "list": [
          {
            "id": "default",
            "name": "OpenClaw Assistant",
            "workspace": "~/.openclaw/workspace"
          },
          {
            "id": "promptrich",
            "name": "Agent PromptRich",
            "workspace": "~/.openclaw/agents/promptrich"
          },
          {
            "id": "daily_news_promptrich",
            "name": "Daily News PromptRich",
            "workspace": "~/.openclaw/agents/daily_news_promptrich"
          }
        ]
      },
      "mcp": {
        "servers": {
          "tradingview": {
            "url": "http://tradingview-mcp-service.mcp-tools.svc.cluster.local/mcp",
            "transport": "streamable-http"
          }
        }
      },
      "cron": { 
        "enabled": true 
      },
      "channels": {
        "telegram": {
          "enabled": true,
          "accounts": {
            "promptrich": {
              "botToken": {
                "source": "env",
                "provider": "default",
                "id": "TELEGRAM_BOT_TOKEN",
                "dmPolicy": "pairing"
              }
            },
            "daily_news_promptrich": {
              "botToken": {
                "source": "env",
                "provider": "default",
                "id": "TELEGRAM_DAILY_NEWS_BOT_TOKEN",
                "dmPolicy": "pairing"
              }
            }
          }
        }
      }
    }
  AGENTS.md: |
    # OpenClaw Assistant

    You are a helpful AI assistant running in Kubernetes.
