apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  labels:
    app: openclaw
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "lan",
        "port": 18789,
        "auth": {
          "mode": "token"
        },
        "controlUi": {
          "enabled": true,
          "allowedOrigins": ["https://openclaw.coregate.dev"]
        }
      },
      "models": {
        "mode": "merge",
        "providers": {
          "google-gemini-3": {
            "baseUrl": "https://generativelanguage.googleapis.com/v1beta",
            "apiKey": "${GEMINI_API_KEY}" ,
            "api": "google-generative-ai",
            "models": [
              {
                "id": "gemini-3-flash-preview",
                "name": "Gemini 3 Flash",
                "input": ["text", "image", "video", "audio"],
                "contextWindow": 1048576,
                "maxTokens": 65536
              },
              {
                "id": "gemini-3.1-flash-lite",
                "name": "Gemini 3.1 Flash-Lite",
                "input": ["text", "image", "video", "audio"],
                "contextWindow": 1048576,
                "maxTokens": 65536
              },
              {
                "id": "gemini-3.1-pro-preview",
                "name": "Gemini 3.1 Pro Preview",
                "input": ["text", "image"],
                "contextWindow": 1048576,
                "maxTokens": 65536
              }
            ]
          }
        }
      },
      "agents": {
        "defaults": {
          "workspace": "~/.openclaw/workspace",
          "model": {
            "primary": "gemini-3.1-flash-lite"
          },
          "heartbeat": {
            "every": "0m"
          }
        },
        "list": [
          {
            "id": "default",
            "name": "OpenClaw Assistant",
            "workspace": "~/.openclaw/workspace"
          }
        ]
      },
      "mcp": {
        "servers": {
          "tradingview": {
            "url": "http://tradingview-mcp-service.mcp-tools.svc.cluster.local/mcp",
            "transport": "streamable-http"
          }
        }
      },
      "cron": { "enabled": false },
      "channels": {
        "telegram": {
          "botToken": {
            "source": "env",
            "provider": "default",
            "id": "TELEGRAM_BOT_TOKEN"
          }
        }
      }
    }
  AGENTS.md: |
    # OpenClaw Assistant

    You are a helpful AI assistant running in Kubernetes.
