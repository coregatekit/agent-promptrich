apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-vertex-ai-es
  namespace: openclaw
spec:
  refreshInterval: "15s" # ให้ Sync ทุกๆ 15 วินาที
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: vertex-secret # ชื่อ Secret ที่จะไปโผล่ใน Kubernetes
    creationPolicy: Owner
  data:
    - secretKey: GOOGLE_APPLICATION_CREDENTIALS # Key ใน k8s Secret
      remoteRef:
        key: openclaw/gcp-vertex-key # Path ใน Vault
        property: credentials # Key ใน Vault
