apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: openclaw
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200" # URL ของ Vault ใน k3s
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "openclaw-role" # Role ที่สร้างไว้ในขั้นตอนที่ 2.4
          serviceAccountRef:
            name: "openclaw-sa"
