services:
  tradingview-mcp:
    image: ghcr.io/coregatekit/tradingview-mcp:sha-948a476
    container_name: tradingview-mcp
    restart: unless-stopped
    environment:
      - MCP_ALLOWED_HOSTS=*
    ports:
      - "8000:8000"
    networks:
      - openclaw
    deploy:
      resources:
        reservations:
          cpus: '0.1'
          memory: 256M

  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:2026.8.1-beta.3
    container_name: openclaw-gateway
    restart: unless-stopped
    init: true
    user: "1000:1000"
    env_file:
      - .env
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_DISABLE_BONJOUR: "1"
      NODE_ENV: production
      TZ: ${TZ:-Asia/Bangkok}
    command:
      - node
      - /app/dist/index.js
      - gateway
      - run
    ports:
      - "127.0.0.1:18789:18789"
    volumes:
      - ./openclaw-data:/home/node/.openclaw
    tmpfs:
      - /tmp:uid=1000,gid=1000
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:18789/healthz').then((response) =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - tradingview-mcp
    networks:
      - openclaw
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

networks:
  openclaw:
    external: true
