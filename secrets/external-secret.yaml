apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openfang-secrets
  namespace: openfang
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: openfang-k8s-secret
    creationPolicy: Owner
  data:
    - secretKey: telegram-token
      remoteRef:
        key: secret/data/openfang/config
        property: TELEGRAM_BOT_TOKEN
    - secretKey: gemini-api-key
      remoteRef:
        key: secret/data/openfang/config
        property: GEMINI_API_KEY
